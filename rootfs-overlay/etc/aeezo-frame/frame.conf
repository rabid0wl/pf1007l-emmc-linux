# AEEZO frame slideshow settings (defaults shown). Restart to apply: rc-service aeezo-frame restart
# The Immich API key lives in /etc/aeezo-frame/immich.key (mode 600), written by immich-setup.sh.

# Required: your Immich server, as reachable from the frame.
#IMMICH_URL=http://<server-ip>:2283
# random, or album:<exact album name>, e.g. SOURCE=album:Frame
#SOURCE=random
#INTERVAL=30
#FADE=2.0
#CACHE_DIR=/var/cache/aeezo-frame
#CACHE_MAX=300
#BATCH=40
#REFRESH=1800
#SKIP_PREFIXES=Screenshot,screenshot,Screen Shot

# Screen sleep, in local time (install tzdata and point /etc/localtime at your zone, or the frame
# runs on UTC). Dark between these; a touch lights it for WAKE_FOR seconds and that waking touch
# doesn't also count as a tap. SLEEP_AT empty = never sleep.
#SLEEP_AT=23:00
#WAKE_AT=05:30
#WAKE_FOR=120

# Backlight level 0-10 (linear PWM duty).
#BRIGHT=8
