# U-Boot distro boot reads this from the bootable partition.
# NOTE: no console=ttyGS0 here. The LAST console= becomes /dev/console; if that's the USB gadget
# serial and nothing is plugged into the other end (a plain charger), init blocks and boot hangs.
default aeezo
timeout 1

label aeezo
	kernel /boot/zImage
	fdt /boot/sun8i-a33-aeezo-u708hc.dtb
	append root=PARTUUID=aee20000-01 rootwait rw console=tty0 fbcon=rotate:1 loglevel=4 g_multi.removable=1
